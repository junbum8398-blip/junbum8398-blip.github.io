<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>박준범 포트폴리오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  /* layout idea: a portfolio you talk to — glass sidebar of topics, a chat log that answers with rich cards */
  --bg:#08090B;
  --glass:#121418D9;
  --glass-2:#17191F;
  --line:#2A2D35;
  --text:#ECEEF2;
  --muted:#8A8F9A;
  --amber:#7FD8E8;
  --mint:#5EE6B8;
  --violet:#9D8CFF;
  --rose:#FF7A8A;
  --body:'Pretendard','Noto Sans KR',system-ui,sans-serif;
  --mono:'Space Mono',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased;}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(700px 500px at 80% 0%,#9D8CFF14,transparent 70%),radial-gradient(600px 400px at 0% 100%,#5EE6B80D,transparent 70%);}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none;}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
a{color:var(--amber);}
.app{position:relative;height:100%;display:grid;grid-template-columns:260px 1fr;gap:14px;padding:14px;}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(14px);}

/* sidebar */
aside{display:flex;flex-direction:column;overflow:hidden;}
.me{display:flex;gap:12px;align-items:center;padding:18px;border-bottom:1px solid var(--line);}
.av{width:46px;height:46px;border-radius:14px;object-fit:cover;border:1px solid #4A4F5C;filter:grayscale(.2);display:grid;place-items:center;font-weight:900;background:linear-gradient(135deg,var(--amber),var(--rose));color:#1A0F05;}
.me b{display:block;font-size:16px;}
.me small{color:var(--mint);font-size:12.5px;}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--muted);padding:16px 18px 8px;}
nav{display:flex;flex-direction:column;gap:4px;padding:0 10px;}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid transparent;font-size:14px;text-align:left;color:#C9D0DE;}
.nav:hover{background:var(--glass-2);}
.nav.on{background:var(--glass-2);border-color:#3A4458;color:var(--text);box-shadow:inset 3px 0 0 var(--amber);}
.nav .ic{width:18px;text-align:center;color:var(--muted);}
.nav .ct{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;}
.quick{display:flex;flex-direction:column;gap:8px;padding:0 12px;}
.chip{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:linear-gradient(90deg,#9D8CFF14,transparent);font-size:13.5px;text-align:left;}
.chip:hover{border-color:var(--violet);}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--violet);flex:none;}
.chip.g{background:linear-gradient(90deg,#5EE6B814,transparent);} .chip.g i{background:var(--mint);} .chip.g:hover{border-color:var(--mint);}
.chip.a{background:linear-gradient(90deg,#FFB54714,transparent);} .chip.a i{background:var(--amber);} .chip.a:hover{border-color:var(--amber);}
.foot{margin-top:auto;padding:14px 18px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 4px #5EE6B822;}

/* main */
main{display:flex;flex-direction:column;overflow:hidden;min-width:0;}
.top{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);}
.top .t{font-family:var(--mono);font-size:12px;color:var(--muted);}
.top .sp{flex:1;}
.pill{font-family:var(--mono);font-size:12px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;color:var(--text);text-decoration:none;}
.pill:hover{border-color:var(--muted);}
.menu-btn{display:none;}
#log{flex:1;overflow-y:auto;padding:24px clamp(16px,4vw,48px) 30px;display:flex;flex-direction:column;gap:22px;scroll-behavior:smooth;}
.msg{display:flex;gap:12px;align-items:flex-start;max-width:980px;width:100%;margin:0 auto;animation:in .35s ease-out both;}
@keyframes in{from{opacity:0;transform:translateY(10px);}}
.msg .bot img{width:100%;height:100%;object-fit:cover;border-radius:10px;}
.msg .bot{flex:none;width:32px;height:32px;border-radius:10px;overflow:hidden;display:grid;place-items:center;font-size:12px;font-weight:900;background:var(--glass-2);border:1px solid var(--line);color:var(--amber);}
.msg .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px;}
.msg .say{font-size:15.5px;line-height:1.75;color:#D5DBE7;}
.msg .say b{color:var(--text);}
.msg.user{justify-content:flex-end;}
.msg.user .q{background:var(--glass-2);border:1px solid #3A4458;padding:10px 16px;border-radius:16px 16px 4px 16px;font-size:14.5px;max-width:70%;}
.typing{display:inline-flex;gap:4px;padding:6px 0;}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1s infinite;}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{opacity:.25;transform:translateY(-3px);}}

/* rich cards */
.card{background:var(--glass-2);border:1px solid var(--line);border-radius:20px;padding:22px;}
.hero{display:grid;grid-template-columns:minmax(260px,.85fr) 1.15fr;overflow:hidden;padding:0;border-radius:24px;background:linear-gradient(180deg,#1A1C22,#121418);box-shadow:0 30px 60px #0008, inset 0 1px 0 #ffffff10;}
.hero .art{position:relative;min-height:360px;background:#0E0F13;border-right:1px solid var(--line);overflow:hidden;}
.hero .me-art::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background-image:radial-gradient(#ffffff22 1px,transparent 1.2px);background-size:7px 7px;-webkit-mask-image:linear-gradient(90deg,transparent 30%,#000 100%);mask-image:linear-gradient(90deg,transparent 30%,#000 100%);}
.hero .me-art::after{content:"";position:absolute;inset:0;z-index:1;background:radial-gradient(circle at 50% 38%,#9D8CFF26,transparent 60%);}
.hero .me-art img{position:absolute;inset:auto;left:0;right:0;margin:0 auto;bottom:0;height:92%;width:auto;max-width:none;z-index:1;filter:grayscale(1) contrast(1.08) brightness(.95);opacity:.92;transition:filter .5s ease;-webkit-mask-image:linear-gradient(180deg,#000 60%,transparent 97%),linear-gradient(90deg,transparent 0%,#000 16%,#000 84%,transparent 100%);-webkit-mask-composite:source-in;mask-image:linear-gradient(180deg,#000 60%,transparent 97%),linear-gradient(90deg,transparent 0%,#000 16%,#000 84%,transparent 100%);mask-composite:intersect;}
.hero:hover .me-art img{filter:grayscale(0) contrast(1) brightness(1);}
.hero .info{padding:32px 30px;display:flex;flex-direction:column;gap:18px;justify-content:center;}
.hero h1{font-weight:700;line-height:1.02;letter-spacing:-.01em;text-transform:uppercase;}
.hero h1 .l1{display:block;font-size:clamp(34px,4.4vw,56px);font-weight:400;color:#D9DCE2;}
.hero h1 .l2{display:block;font-size:clamp(34px,4.4vw,56px);font-weight:800;background:linear-gradient(90deg,#F4F5F7 0%,#BFC6D2 45%,#9ED7E4 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}
.tag::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;margin-right:7px;vertical-align:middle;opacity:.8;}
.tags{display:flex;flex-wrap:wrap;gap:8px;}
.tag{font-family:var(--body);font-weight:500;letter-spacing:.04em;font-size:12px;padding:6px 13px;border-radius:999px;border:1px solid #33363F;background:#1B1D23;color:#A99CFF;text-transform:uppercase;}
.tag.m{color:var(--mint);} .tag.a{color:var(--amber);}
.desc{font-size:15px;line-height:1.75;color:#C9D0DE;max-width:56ch;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.stat{border:1px solid #2E3139;border-radius:16px;padding:16px;background:linear-gradient(180deg,#1C1E24,#15171C);box-shadow:inset 0 1px 0 #ffffff0D;}
.stat .n{font-family:var(--mono);font-weight:700;font-size:28px;font-variant-numeric:tabular-nums;}
.stat .n.v{color:var(--violet);} .stat .n.m{color:var(--mint);} .stat .n.a{color:var(--amber);}
.stat .l{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:8px;line-height:1.5;}
.kick{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;color:var(--muted);}
.card h3{font-size:22px;font-weight:700;margin:6px 0 10px;}
.card p,.card li{font-size:14.5px;line-height:1.75;color:#C9D0DE;}
.card ul{padding-left:18px;display:flex;flex-direction:column;gap:4px;}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;}
.shot{width:100%;border-radius:14px;border:1px solid var(--line);display:block;cursor:zoom-in;background:#0F1218;}
.cap{font-size:12.5px;color:var(--muted);margin-top:6px;}
figure{display:flex;flex-direction:column;}
/* carousel */
.car{position:relative;}
.track{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 10px;scrollbar-width:none;}
.track::-webkit-scrollbar{display:none;}
.slide{flex:0 0 min(420px,82%);scroll-snap-align:start;}
.arrows{display:flex;gap:8px;justify-content:flex-end;}
.arrows button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);}
.arrows button:hover{border-color:var(--muted);}
table{width:100%;border-collapse:collapse;font-size:14px;}
th{text-align:left;font-family:var(--mono);font-size:11.5px;color:var(--muted);padding:10px;border-bottom:1px solid var(--line);}
td{padding:11px 10px;border-bottom:1px solid #222937;line-height:1.6;vertical-align:top;}
.mine{color:var(--mint);font-weight:700;white-space:nowrap;}
.team{color:var(--muted);white-space:nowrap;}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;}
.step{border:1px solid var(--line);border-radius:14px;padding:14px;background:#0F1218;position:relative;}
.step b{font-family:var(--mono);font-size:11px;color:var(--amber);}
.step.h b{color:var(--mint);}
.step h4{font-size:15px;margin:6px 0 4px;}
.step p{font-size:13px;line-height:1.6;color:var(--muted);}
.quest{display:grid;grid-template-columns:70px 1fr;gap:8px 16px;}
.quest dt{font-family:var(--mono);font-size:12px;color:var(--violet);padding-top:3px;}
.quest dd{font-size:14.5px;line-height:1.7;color:#C9D0DE;}
.qtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.qtab{font-size:13px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);color:var(--muted);}
.qtab.on{border-color:var(--violet);color:var(--text);background:#9D8CFF1A;}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;}
.pair .shot{aspect-ratio:16/9;object-fit:cover;}
.pair .ar{font-family:var(--mono);color:var(--amber);}
.stack{display:flex;flex-wrap:wrap;gap:8px;}
.stack span{font-family:var(--mono);font-size:12px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:#0F1218;}
.stack span.ai{border-color:#9D8CFF66;color:var(--violet);}
.follow{display:flex;flex-wrap:wrap;gap:8px;}
.follow button{font-size:13px;padding:7px 12px;border-radius:999px;border:1px dashed #3A4458;color:var(--muted);}
.follow button:hover{border-style:solid;color:var(--text);border-color:var(--muted);}
.steps5{display:flex;flex-direction:column;gap:8px;}
.s5{display:grid;grid-template-columns:28px 130px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#0F1218;}
.s5 .n{font-family:var(--mono);font-weight:700;color:var(--violet);}
.s5 b{font-size:14.5px;}
.s5 p{font-size:13.5px;line-height:1.55;color:var(--muted);margin:0;}
.s5 .t{font-family:var(--mono);font-size:11px;padding:4px 10px;border-radius:999px;border:1px solid #3A3E48;color:#A99CFF;white-space:nowrap;}
.s5 .t.v{color:var(--amber);} .s5 .t.m{color:var(--mint);}
.aibox{border-color:#FF7A8A55;} .aibox .kick{color:var(--rose);}
.mebox{border-color:#7FD8E855;} .mebox .kick{color:var(--amber);}
@media (max-width:860px){.s5{grid-template-columns:24px 1fr;}.s5 p,.s5 .t{grid-column:2;justify-self:start;}}
/* lab */
.lab{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.evs{display:flex;flex-wrap:wrap;gap:8px;}
.ev{font-size:13px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:#0F1218;}
.ev:hover{border-color:var(--muted);} .ev.bad{color:var(--rose);border-color:#FF7A8A66;}
.tg{display:flex;align-items:center;gap:10px;font-size:13px;margin:12px 0;}
.sw{width:46px;height:24px;border-radius:12px;background:var(--mint);position:relative;}
.sw::after{content:"";position:absolute;top:3px;left:25px;width:18px;height:18px;border-radius:50%;background:#0B0D12;transition:left .15s;}
.sw.off{background:var(--rose);} .sw.off::after{left:3px;}
.bars{display:flex;flex-direction:column;gap:6px;}
.bars .r{display:grid;grid-template-columns:70px 1fr 26px;gap:8px;align-items:center;font-size:12.5px;}
.bars .t{height:8px;border-radius:4px;background:#0F1218;overflow:hidden;}
.bars .t i{display:block;height:100%;width:0;background:var(--violet);transition:width .25s;}
.bars .r.m .t i{background:var(--rose);}
.bars .v{font-family:var(--mono);text-align:right;}
.term{font-family:var(--mono);font-size:12px;line-height:1.7;background:#07080B;border:1px solid var(--line);border-radius:12px;padding:12px;height:220px;overflow:auto;}
.term .ok{color:var(--mint);} .term .q{color:var(--amber);} .term .f{color:var(--violet);}
.f6{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:10px;}
/* composer */
.composer{padding:14px clamp(16px,4vw,48px) 16px;}
.cbox{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:10px;background:var(--glass-2);border:1px solid #3A4458;border-radius:18px;padding:8px 8px 8px 18px;}
.cbox input{flex:1;background:none;border:none;color:var(--text);font:inherit;font-size:15px;padding:8px 0;outline:none;}
.cbox input::placeholder{color:var(--muted);}
.send{width:40px;height:40px;border-radius:50%;background:#24272F;border:1px solid #3A3E48;color:var(--text);font-weight:900;}
.send:disabled{background:#2A3242;color:var(--muted);cursor:default;}
.note{max-width:980px;margin:8px auto 0;font-size:11.5px;color:var(--muted);text-align:center;}
#lb{position:fixed;inset:0;background:#05060AEE;display:none;align-items:center;justify-content:center;z-index:50;padding:24px;cursor:zoom-out;}
#lb.on{display:flex;}
#lb img{max-width:100%;max-height:100%;border-radius:12px;}
@media (max-width:860px){
  .app{grid-template-columns:1fr;padding:8px;}
  aside{position:fixed;inset:8px auto 8px 8px;width:270px;z-index:30;transform:translateX(-110%);transition:transform .2s;}
  aside.open{transform:none;}
  .menu-btn{display:inline-block;}
  .hero{grid-template-columns:1fr;} .hero .art{min-height:260px;} .hero .me-art{background:radial-gradient(circle at 50% 30%,#2A2D36,#0E0F13 70%);}
.hero .me-art img{object-fit:contain;object-position:center 30%;opacity:1;inset:18px 0 0 0;height:115%;width:100%;-webkit-mask-image:linear-gradient(180deg,#000 52%,transparent 80%),linear-gradient(90deg,transparent 14%,#000 30%,#000 70%,transparent 86%);-webkit-mask-composite:source-in;mask-image:linear-gradient(180deg,#000 52%,transparent 80%),linear-gradient(90deg,transparent 14%,#000 30%,#000 70%,transparent 86%);mask-composite:intersect;}
.hero .me-art::after{display:none;}
.hero .art::after{background:linear-gradient(180deg,transparent 40%,var(--glass-2));}
  .lab,.pair{grid-template-columns:1fr;} .pair .ar{justify-self:center;transform:rotate(90deg);}
  .stats{grid-template-columns:1fr 1fr 1fr;} .stat .n{font-size:22px;}
  .msg.user .q{max-width:85%;}
  .top .t{display:none;}
  .cbox input{font-size:14px;}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important;}}
</style>
</head>
<body>
<div class="app">
  <aside class="panel" id="side">
    <div class="me"><img class="av" src="me_av.png" alt="박준범"><div><b>박준범</b><small>AI Game Maker 지원자</small></div></div>
    <p class="lbl">PORTFOLIO</p>
    <nav id="nav"></nav>
    <p class="lbl">QUICK ASK</p>
    <div class="quick">
      <button class="chip" data-ask="log"><span>AI와 일한 과정은?</span><i></i></button>
      <button class="chip g" data-ask="judge"><span>직접 판단한 순간은?</span><i></i></button>
      <button class="chip a" data-ask="role"><span>팀에서 맡은 역할은?</span><i></i></button>
    </div>
    <div class="foot"><span class="dot"></span>2027.03부터 풀타임 가능</div>
  </aside>

  <main class="panel">
    <div class="top">
      <button class="pill menu-btn" id="menuBtn" aria-label="메뉴 열기">☰ 메뉴</button>
      <span class="t">박준범 · AI Game Maker 포트폴리오</span>
      <span class="sp"></span>
      <a class="pill" href="https://github.com/junbum8398-blip" target="_blank" rel="noopener">GitHub</a>
      <button class="pill" id="resetBtn">처음부터</button>
    </div>
    <div id="log" role="log" aria-live="polite"></div>
    <div class="composer">
      <form class="cbox" id="form">
        <input id="inp" type="text" autocomplete="off" placeholder="궁금한 걸 물어보세요 · 예: NODEVERSE가 뭐예요?" aria-label="질문 입력">
        <button class="send" id="send" type="submit" disabled aria-label="보내기">↑</button>
      </form>
      <p class="note">질문에 맞춰 미리 준비한 답변을 보여 드려요. 입력한 내용은 어디에도 전송되지 않습니다.</p>
    </div>
  </main>
</div>
<div id="lb" role="dialog" aria-label="이미지 크게 보기"><img alt=""></div>

<script>
/* 플레이 영상 링크 (구글 드라이브 공유 링크, 로그인 없이 열리게) */
const VIDEO_URL = "";
const img = n => `${n}`;
const fig = (s,a,c) => `<figure><img class="shot" src="${img(s)}" alt="${a}" loading="lazy">${c?`<figcaption class="cap">${c}</figcaption>`:''}</figure>`;
const follow = (...ids) => `<div class="follow">${ids.map(id=>`<button data-go="${id}">${TOPICS[id].q}</button>`).join('')}</div>`;

const TOPICS = {
  about:{ nav:'소개', ic:'◉', ct:'HOME', q:'자기소개 해 주세요', keys:['소개','누구','자기','안녕','about','처음'],
    say:'안녕하세요, <b>박준범</b>입니다. 왼쪽 메뉴를 누르거나 아래 입력창에 궁금한 걸 물어보세요. 미리 준비한 답으로 안내해 드릴게요.',
    card:()=>`<div class="card hero"><div class="art me-art"><img src="${img('me.png')}" alt="박준범 사진"></div>
      <div class="info"><h1><span class="l1">박준범</span><span class="l2">AI Game Maker</span></h1>

      <div class="card"><p>박준범 · junbum8398@gmail.com · <a href="https://github.com/junbum8398-blip" target="_blank" rel="noopener">github.com/junbum8398-blip</a></p></div>`,
    next:['about'] },
};
const NAV = ['about','nodeverse','log','role','ai','judge','lab','netfit','stack','next'];

const $ = s => document.querySelector(s);
const log = $('#log');
$('#nav').innerHTML = NAV.map(id=>`<button class="nav" data-go="${id}"><span class="ic">${TOPICS[id].ic}</span>${TOPICS[id].nav}${TOPICS[id].ct?`<span class="ct">${TOPICS[id].ct}</span>`:''}</button>`).join('');

let busy=false;
function setNav(id){ document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on',b.dataset.go===id)); }
function addUser(text){
  const m=document.createElement('div'); m.className='msg user'; m.innerHTML=`<div class="q"></div>`; m.querySelector('.q').textContent=text;
  log.appendChild(m); m.scrollIntoView({block:'end'});
}
function answer(id, asked){
  if(busy) return; busy=true;
  const t=TOPICS[id]; setNav(id);
  if(asked!==false) addUser(asked||t.q);
  const m=document.createElement('div'); m.className='msg'; m.innerHTML=`<div class="bot"><img src="me_av.png" alt=""></div><div class="body"><div class="typing"><i></i><i></i><i></i></div></div>`;
  log.appendChild(m); m.scrollIntoView({block:'end'});
  const delay = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 550;
  setTimeout(()=>{
    const body=m.querySelector('.body');
    body.innerHTML=`<p class="say">${t.say}</p>${t.card()}${t.next?follow(...t.next):''}`;
    wire(body); if(t.init) t.init(body);
    m.scrollIntoView({block:'start',behavior:'smooth'});
    busy=false;
  }, delay);
}
function miss(text){
  addUser(text);
  const m=document.createElement('div'); m.className='msg';
  m.innerHTML=`<div class="bot"><img src="me_av.png" alt=""></div><div class="body"><p class="say">그 질문에는 미리 써 둔 답이 없어요. 대신 이런 걸 물어볼 수 있어요.</p>${follow('nodeverse','ai','judge','role','lab')}</div>`;
  log.appendChild(m); wire(m); m.scrollIntoView({block:'start',behavior:'smooth'});
}
function route(text){
  const q=text.toLowerCase().replace(/\s+/g,'');
  let best=null, score=0;
  for(const id of NAV){ const s=TOPICS[id].keys.reduce((a,k)=>a+(q.includes(k.toLowerCase())?k.length:0),0); if(s>score){score=s;best=id;} }
  if(best) answer(best,text); else miss(text);
}
function wire(root){
  root.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{ answer(b.dataset.go); closeSide(); }));
  root.querySelectorAll('.shot').forEach(i=>i.addEventListener('click',()=>{ const lb=$('#lb'); lb.querySelector('img').src=i.src; lb.querySelector('img').alt=i.alt; lb.classList.add('on'); }));
  root.querySelectorAll('[data-count]').forEach(el=>{ const to=+el.dataset.count,t0=performance.now(); const st=n=>{const p=Math.min(1,(n-t0)/900); el.textContent=Math.round(to*(1-Math.pow(1-p,3))); if(p<1) requestAnimationFrame(st);}; requestAnimationFrame(st); });
  root.querySelectorAll('.car').forEach(c=>{ const tr=c.querySelector('.track'); c.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>tr.scrollBy({left:+b.dataset.dir*tr.clientWidth*.8,behavior:'smooth'}))); });
  root.querySelectorAll('.qtabs').forEach(tabs=>{ const card=tabs.parentElement; tabs.querySelectorAll('.qtab').forEach(t=>t.addEventListener('click',()=>{ tabs.querySelectorAll('.qtab').forEach(x=>x.classList.toggle('on',x===t)); card.querySelectorAll('.qpane').forEach(p=>p.hidden=p.dataset.q!==t.dataset.q); })); });
}
function telemetry(root){
  const names={start:'시작',move:'이동',mistake:'실수',undo:'되돌리기',clear:'클리어'};
  const c={start:0,move:0,mistake:0,undo:0,clear:0}; let on=true,sent=0,queue=[];
  const term=root.querySelector('.term'),bars=root.querySelector('.bars'),sw=root.querySelector('.sw'),swt=root.querySelector('.swt'),f6=root.querySelector('.f6');
  const line=(cl,t)=>{const d=document.createElement('div');d.className=cl;d.textContent=t;term.appendChild(d);term.scrollTop=term.scrollHeight;};
  const draw=()=>{const mx=Math.max(1,...Object.values(c)); bars.innerHTML=Object.keys(c).map(k=>`<div class="r ${k==='mistake'?'m':''}"><span>${names[k]}</span><span class="t"><i style="width:${c[k]/mx*100}%"></i></span><span class="v">${c[k]}</span></div>`).join('');};
  const meta=r=>{f6.textContent=`F6 DEBUG · sent ${sent} · queued ${queue.length}${r?' · RTT '+r:''}`;};
  root.querySelectorAll('.ev').forEach(b=>b.addEventListener('click',()=>{ const e=b.dataset.e; c[e]++; draw(); const ts=new Date().toTimeString().slice(0,8);
    if(on){sent++; const r=(18+Math.round(Math.random()*30))+'ms'; line('ok',`${ts} POST /v1/events {type:"${e}"} → 200 · ${r}`); meta(r);}
    else{queue.push(e); line('q',`${ts} 서버 없음 → 큐에 보관 (${queue.length}건) · 게임은 계속`); meta();} }));
  sw.addEventListener('click',()=>{ on=!on; sw.classList.toggle('off',!on); sw.setAttribute('aria-pressed',on); swt.textContent='서버 연결 '+(on?'ON':'OFF');
    if(on&&queue.length){line('f',`재연결 · 큐에 쌓인 ${queue.length}건 재전송 → 200`); sent+=queue.length; queue=[];} else if(!on) line('q','연결 끊김 · 오프라인 안전 모드'); meta(); });
  draw();
}
/* sidebar & composer */
document.querySelectorAll('#nav [data-go]').forEach(b=>b.addEventListener('click',()=>{ answer(b.dataset.go); closeSide(); }));
document.querySelectorAll('[data-ask]').forEach(b=>b.addEventListener('click',()=>{ answer(b.dataset.ask, b.textContent.trim()); closeSide(); }));
const inp=$('#inp'), send=$('#send');
inp.addEventListener('input',()=>send.disabled=!inp.value.trim());
$('#form').addEventListener('submit',e=>{ e.preventDefault(); const v=inp.value.trim(); if(!v||busy) return; inp.value=''; send.disabled=true; route(v); });
$('#resetBtn').addEventListener('click',()=>{ log.innerHTML=''; answer('about',false); });
const side=$('#side'); function closeSide(){ side.classList.remove('open'); }
$('#menuBtn').addEventListener('click',()=>side.classList.toggle('open'));
$('#lb').addEventListener('click',()=>$('#lb').classList.remove('on'));
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ $('#lb').classList.remove('on'); closeSide(); } });
/* rotating placeholder */
const ph=['NODEVERSE가 뭐예요?','AI를 어떻게 썼나요?','직접 판단한 순간은?','실수 데이터는 왜 모았어요?','팀에서 맡은 역할은?'];
let pi=0; setInterval(()=>{ if(document.activeElement!==inp && !inp.value){ pi=(pi+1)%ph.length; inp.placeholder='궁금한 걸 물어보세요 · 예: '+ph[pi]; } },3000);
answer('about',false);
</script>
